<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" role="img" aria-label="Subtle indoor padel court background">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f1e5"/>
      <stop offset="0.46" stop-color="#efe4d2"/>
      <stop offset="1" stop-color="#d8c8ad"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3835"/>
      <stop offset="0.48" stop-color="#1c2423"/>
      <stop offset="1" stop-color="#111716"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="16%" r="65%">
